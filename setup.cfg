[flake8]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv,*/bassins_versants/*

[coverage:run]
source = envergo
# On mesure TOUT le code Python dont le simulateur nitrates se sert, admin et
# commandes de management compris, et RIEN d'autre. Regle : un fichier est
# mesure s'il est dans envergo/nitrates/, ou s'il est importe par le runtime
# nitrates (urls_nitrates, middlewares, backends d'auth, admin, settings).
#
# Sont exclus :
#  - les tests, migrations, __init__/apps.py, settings ;
#  - les templates et assets (un gabarit n'est pas du code executable : le
#    plugin django_coverage_plugin les comptait comme lignes jamais couvertes) ;
#  - les apps Envergo dormantes (REVERT_AT_MERGE_TIME_FOR_UPSTREAM_ENVERGO) :
#    gardees dans le repo pour un remerge upstream, testees par leur propre
#    suite upstream, mais hors du perimetre nitrates. Les quelques vues upstream
#    montees dans config/urls.py (pages d'erreur, rapport CSP) en font partie ;
#  - dans les apps transverses, les fichiers que seules les apps dormantes
#    importent (flows de compte Envergo, outils de formulaire moulinette...).
omit =
    */tests/*
    */tests.py
    */test_*.py
    */conftest.py
    */migrations/*
    */__init__.py
    */apps.py
    config/*
    */templates/*
    *.html
    *.js
    *.css
    envergo/static/*
    # Apps Envergo dormantes.
    envergo/analytics/*
    envergo/confs/*
    envergo/demos/*
    envergo/evaluations/*
    envergo/hedges/*
    envergo/moulinette/*
    envergo/pages/*
    envergo/petitions/*
    envergo/stats/*
    envergo/urlmappings/*
    # geodata : nitrates n'utilise que les modeles (Map, Zone, Department).
    envergo/geodata/admin.py
    envergo/geodata/forms.py
    envergo/geodata/tasks.py
    envergo/geodata/urls.py
    envergo/geodata/utils.py
    envergo/geodata/views.py
    envergo/geodata/management/*
    # users : comptes Envergo (inscription, activation, instructeurs). Nitrates
    # n'utilise que le modele et le backend ; l'admin Envergo des comptes est
    # remplace par celui de envergo/nitrates/admin_perimetre.py.
    envergo/users/adapters.py
    envergo/users/admin.py
    envergo/users/forms.py
    envergo/users/mixins.py
    envergo/users/tasks.py
    envergo/users/urls.py
    envergo/users/views.py
    # contrib : commandes Envergo (anonymisation, review apps, alertes).
    envergo/contrib/management/*
    # utils : helpers des apps dormantes.
    envergo/utils/admin.py
    envergo/utils/auth.py
    envergo/utils/bassins_versants/*
    envergo/utils/formtools_storage.py
    envergo/utils/mattermost.py
    # Stockage S3 : reference seulement par config/settings/production.py, et
    # django-storages n'est installe qu'en prod (non importable en test).
    envergo/utils/storages.py
    envergo/utils/templatetags/*
    envergo/utils/urls.py
    envergo/utils/validators.py
    envergo/utils/widgets.py

[coverage:report]
show_missing = True
skip_covered = False
# SEUIL BLOQUANT : sous le seuil, `coverage report` sort en code 2 -> le job
# pytest echoue -> le gate CI refuse le deploiement (staging comme prod).
#
# Mesure de reference du 07/10/2026 sur ce perimetre : 94 % (10 694 lignes,
# 695 non couvertes), tests Envergo dormants non joues. Seuil pose 2 points sous la mesure : il interdit toute
# regression sans bloquer l'existant. A remonter quand la mesure monte.
fail_under = 92
