[pytest]
addopts = --ds=config.settings.test --reuse-db
python_files = tests.py test_*.py
# Perimetre nitrates uniquement : les apps Envergo dormantes (avis, petitions,
# haies...) gardent leurs tests dans le depot mais ne sont plus jouees. Pour
# en lancer une a la main : `pytest envergo/petitions`.
testpaths =
    envergo/nitrates
    envergo/users/tests/test_backends.py
    envergo/users/tests/test_models_couverture.py
    envergo/decorators
    envergo/middleware
    envergo/utils/tests/test_socle_nitrates.py
norecursedirs = node_modules .venv
markers =
    disable_regime_haie_criterion: Disable the automatic creation of regime unique haie criterion in autouse fixtures
    haie: marks tests that need haie URL configuration and domain settings
