{% load static %}

<div class="fr-header__body">
  <div class="fr-container">
    <div class="fr-header__body-row">
      <div class="fr-header__brand fr-enlarge-link">
        <img class="fr-header__brand-top fr-hidden-md"
             src="{% static 'images/marianne.svg' %}"
             alt="République française">
        <div class="fr-header__brand-top fr-hidden fr-unhidden-md">
          <div class="fr-header__logo">
            <p class="fr-logo">
              République
              <br>
              Française
            </p>
          </div>
        </div>
        {% comment %}
        Logo Nitrat'Info en logo operateur DSFR (#549, maquette Coralie) : il
        porte le nom du service, la baseline est retiree. Version fond clair
        ou fond fonce du kit selon le theme (bascule CSS dans marque.css).
        {% endcomment %}
        <div class="fr-header__operator nitrates-header__operator">
          <a href="/" title="Accueil - Nitrat'Info">
            <img class="nitrates-logo nitrates-logo--clair"
                 src="{% static 'nitrates/logo/nitratinfo-logo-fond-clair.svg' %}"
                 width="144"
                 height="34"
                 alt="Nitrat'Info">
            <img class="nitrates-logo nitrates-logo--fonce"
                 src="{% static 'nitrates/logo/nitratinfo-logo-fond-fonce.svg' %}"
                 width="144"
                 height="34"
                 alt="Nitrat'Info">
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
