- cle: definition.campagne-culturale
  libelle_admin: Définition — Campagne culturale
  type_contenu: definition
  titre_public: Campagne culturale
  categorie: pratique-documents
  termes_declencheurs:
  - campagne culturale
  schema: 1
  blocs:
  - type: paragraphe
    data:
      texte: "Période allant du 1er septembre au 31 août de l'année suivante ou une\
        \ période de douze mois choisie par l'exploitant. Cette période vaut pour toute\
        \ l'exploitation et est identique pour le plan de fumure et le cahier d'enregistrement\
        \ définis dans le programme d'actions national."

- cle: definition.couvert-vegetal-interculture
  libelle_admin: Définition — Couvert végétal d'interculture (CI)
  type_contenu: definition
  titre_public: Couvert végétal d'interculture (CI)
  categorie: pratique-documents
  termes_declencheurs:
  - couvert végétal d'interculture
  - couvert d'interculture
  schema: 1
  blocs:
  - type: paragraphe
    data:
      texte: "Peuplement végétal semé présent sur une parcelle pendant l'interculture,\
        \ qui n'est pas issu des repousses de la culture précédente."

- cle: definition.effluents-peu-charges
  libelle_admin: Définition — Effluents peu chargés
  type_contenu: definition
  titre_public: Effluents peu chargés
  categorie: fertilisants-effluents
  termes_declencheurs:
  - effluents peu chargés
  - effluent peu chargé
  schema: 1
  blocs:
  - type: paragraphe
    data:
      texte: "Effluents issus d'un traitement d'effluents bruts et ayant une quantité\
        \ d'azote inférieure à 0,5 kg par m3."

- cle: definition.types-fertilisants
  libelle_admin: Définition — Fertilisants de type 0, Ia, Ib, II et III
  type_contenu: definition
  titre_public: Fertilisants de type 0, Ia, Ib, II et III
  categorie: fertilisants-effluents
  termes_declencheurs:
  - type 0
  - type Ia
  - type Ib
  - type II
  - type III
  schema: 1
  blocs:
  - type: tableau
    data:
      avec_entetes: true
      lignes:
      - [Type, Caractéristiques, Exemples, Valeurs guides]
      - - "0"
        - "Produits organiques caractérisés par une organisation nette à moyen terme\
          \ de l'azote"
        - "Boues de papeterie, marcs de raisins frais, composts de déchets verts jeunes\
          \ et ligneux"
        - "C/N > 20 ; Nmin/Ntot < 20 %"
      - - Ia
        - "Produits organiques à minéralisation d'azote très lente"
        - "Fumiers compacts non susceptibles d'écoulement, composts d'effluents d'élevage\
          \ à l'exception des composts de fientes de volailles. Composts d'ordures\
          \ ménagères résiduelles. Composts de fractions solides de digestats de méthanisation"
        - "C/N > 10 ; Nmin/Ntot < 20 % ; ISMO > 70 %"
      - - Ib
        - "Produits organiques à minéralisation d'azote lente"
        - "Déjections animales avec litière susceptibles d'écoulement, à l'exception\
          \ des fumiers de volaille. Composts de MIATE (matières d'intérêt agronomique\
          \ issues du traitement des eaux) mélangées à un support carboné, composts\
          \ de biodéchets"
        - "C/N > 8 ; 20 % < Nmin/Ntot ≤ 40 % ; ISMO > 50 %"
      - - II
        - "Produits organiques à minéralisation d'azote rapide"
        - "Lisiers, fumiers de volaille, effluents peu chargés, vinasses de betterave.\
          \ Farines de plumes, de poisson, de sang, d'os, tourteaux de ricin. Digestats\
          \ bruts de méthanisation, fractions liquides des digestats de méthanisation."
        - "Tout effluent organique qui n'entre pas dans les catégories précédentes."
      - - III
        - "Engrais azotés minéraux"
        - "Ammonitrates, urée…"
        - "-"

