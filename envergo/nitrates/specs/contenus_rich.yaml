- cle: page.cgu
  libelle_admin: Page — Conditions générales d'utilisation
  schema: 1
  blocs:
  - type: paragraphe
    data:
      texte: "Création : 15/09/2026 - mise à jour : 15/09/2026"
  - type: titre_principal
    data:
      texte: Article 1 - Champ d’application
  - type: paragraphe
    data:
      texte: Les présentes conditions générales d’utilisation (ci-après « CGU ») précisent le cadre juridique
        du service numérique « Nitrat’Info » accessible depuis l’url https://nitrates.beta.gouv.fr/ (ci-après
        « la Plateforme »).
  - type: titre_principal
    data:
      texte: Article 2 - Objet de la Plateforme
  - type: paragraphe
    data:
      texte: La Plateforme, en cours d’expérimentation, permet à tout Utilisateur de disposer d’un questionnaire
        et d’une page de résultat permettant de savoir, pour sa parcelle, si l'épandage de fertilisants
        azotés est autorisé, soumis à conditions ou interdit selon la réglementation nitrates en vigueur.
  - type: paragraphe
    data:
      texte: La Plateforme ne s’adresse qu’aux exploitants agricoles et aux conseillers agricoles et ne
        délivre que des informations indicatives qui ne se substituent en aucun cas à un accompagnement
        complémentaire.
  - type: titre_principal
    data:
      texte: Article 3 - Définitions
  - type: paragraphe
    data:
      texte: « L’Utilisateur » est toute personne physique qui utilise la Plateforme.
  - type: paragraphe
    data:
      texte: La « Plateforme » est le service numérique proposé par la Ruche numérique rattachée au Secrétariat
        Général du ministère en charge de l’agriculture.
  - type: paragraphe
    data:
      texte: « L’Éditeur » est la Ruche numérique rattachée au Secrétariat Général du ministère en charge
        de l’agriculture qui met à la disposition du public la Plateforme.
  - type: titre_principal
    data:
      texte: Article 4 - Fonctionnalités
  - type: titre_paragraphe
    data:
      texte: 4.1 - Identifier les périodes minimales d’interdiction d’épandage et les conditions d’épandage
        des fertilisants azotés
  - type: paragraphe
    data:
      texte: La Plateforme propose via une série de questions d’orienter l’Utilisateur en fonction de
        l’occupation du sol et du fertilisant qu’il prévoit d’épandre pour qu’il puisse obtenir un résultat
        personnalisé concernant les périodes minimales d'interdiction d'épandage et les conditions d'épandage
        du Programme d’Action National et des Programmes d’Action Régionaux des territoires d’expérimentation
        sur sa parcelle selon la réglementation.
  - type: titre_paragraphe
    data:
      texte: 4.2 - Améliorer la Plateforme
  - type: paragraphe
    data:
      texte: La Plateforme permet aux Utilisateurs via deux champs libres de signaler un bug et d’exprimer
        leurs attentes, propositions et opinions sur la Plateforme.
  - type: titre_principal
    data:
      texte: Article 5 - Déploiement du Service
  - type: paragraphe
    data:
      texte: Le Service est actuellement en cours d’expérimentation dans les départements du Nord et du
        Pas-de-Calais et dans la région Grand-Est.
  - type: titre_principal
    data:
      texte: Article 6 - Responsabilités
  - type: titre_paragraphe
    data:
      texte: 6.1 Responsabilités de l’Éditeur
  - type: paragraphe
    data:
      texte: Les sources des informations diffusées sur le Service sont réputées fiables mais le Service
        ne garantit pas qu'elles soient exemptes de défauts, d'erreurs ou d'omissions.
  - type: paragraphe
    data:
      texte: Le Service ne délivre aucune autorisation ou décision administrative créatrice de droits pour
        les Utilisateurs. Il s'agit d'un portail que peuvent consulter les Utilisateurs à titre informatif.
  - type: paragraphe
    data:
      texte: L'Editeur s'engage à la sécurisation du Service, notamment en prenant toutes les mesures nécessaires
        permettant de garantir la sécurité et la confidentialité des informations fournies. L'Éditeur fournit
        les moyens nécessaires et raisonnables pour assurer un accès continu, sans contrepartie financière.
  - type: paragraphe
    data:
      texte: Il se réserve la liberté de faire évoluer, de modifier ou de suspendre, sans préavis, le Service
        pour des raisons de maintenance ou pour tout autre motif jugé nécessaire.
  - type: titre_paragraphe
    data:
      texte: 6.2 Responsabilités de l'Utilisateur
  - type: paragraphe
    data:
      texte: L'Utilisateur déclare être pleinement informé et conscient que la Plateforme ne délivre aucune
        autorisation ou décision administrative créatrice de droits pour les Utilisateurs. Il s'agit d'un
        portail que peuvent consulter les Utilisateurs à titre informatif.
  - type: paragraphe
    data:
      texte: "Dans le cadre de l'utilisation de la Plateforme, l'Utilisateur s'engage à :"
  - type: liste
    data:
      items:
      - texte: ne pas divulguer sur la Plateforme des propos ou des contenus illicites, et notamment tous
          contenus contrefaits, diffamatoires, injurieux, insultants, obscènes, offensants, discriminatoires,
          violents, xénophobes, incitant à la haine raciale ou faisant l'apologie du terrorisme, ou tout
          autre contenu contraire à la législation et réglementation applicable ainsi qu'aux bonnes mœurs
          et aux règles de bienséance ;
      - texte: ne pas intégrer et diffuser sur la Plateforme du contenu qui serait contraire à la finalité
          de celui-ci ;
      - texte: ne pas communiquer ou envoyer, par l'intermédiaire de la Plateforme, du contenu, quel qu'il
          soit, qui comprendrait des liens pointant vers des sites internet illicites, offensants ou incompatibles
          avec la finalité de la Plateforme ;
      - texte: ne pas utiliser la Plateforme pour envoyer massivement des messages non sollicités (publicitaires
          ou autres).
  - type: paragraphe
    data:
      texte: Il est rappelé que toute personne procédant à une fausse déclaration pour elle-même ou pour
        autrui s’expose, notamment, aux sanctions prévues à l’article 441-1 du code pénal, prévoyant des
        peines pouvant aller jusqu’à trois ans d’emprisonnement et 45 000 euros d’amende.
  - type: titre_principal
    data:
      texte: Article 7 - Mise à jour des conditions générales d’utilisation
  - type: paragraphe
    data:
      texte: Les termes des présentes CGU peuvent être amendés à tout moment, en fonction des modifications
        apportées à la Plateforme, de l’évolution de la législation ou pour tout autre motif jugé nécessaire.
        Chaque modification donne lieu à une information qui est publiée sur la Plateforme.

- cle: page.accessibilite
  libelle_admin: Page — Déclaration d'accessibilité
  schema: 1
  blocs:
  - type: paragraphe
    data:
      texte: Établie le 18 septembre 2026.
  - type: paragraphe
    data:
      texte: Les ministères chargés de l'Écologie et de l'Agriculture s’engagent à rendre leur service accessible,
        conformément à l’article 47 de la loi n° 2005-102 du 11 février 2005 pour l'égalité des droits et
        des chances, la participation et la citoyenneté des personnes handicapées.
  - type: paragraphe
    data:
      texte: "À cette fin, le ministère de l’agriculture met en œuvre la stratégie et les actions suivantes :"
  - type: liste
    data:
      items:
      - texte:
        - texte: Schéma pluriannuel
          lien: https://agriculture.gouv.fr/telecharger/149999
      - texte:
        - texte: Plan 2025
          lien: https://agriculture.gouv.fr/telecharger/150002
  - type: paragraphe
    data:
      texte: "Le ministère de l’écologie met en œuvre la stratégie et les actions suivantes :"
  - type: liste
    data:
      items:
      - texte:
        - texte: Schéma pluriannuel 2025-2027
          lien: https://www.ecologie.gouv.fr/schema-pluriannuel-daccessibilite-numerique-2025-2027
      - texte:
        - texte: Plan 2026
          lien: https://www.ecologie.gouv.fr/plan-annuel-2026#detail-du-plan-annuel-2026-2
  - type: paragraphe
    data:
      texte:
      - texte: "Cette déclaration d’accessibilité s’applique à "
      - texte: Nitrat'Info
        gras: true
      - texte: " (https://nitrates.beta.gouv.fr/)."
  - type: titre_principal
    data:
      texte: État de conformité
  - type: paragraphe
    data:
      texte:
      - texte: Nitrat'Info
        gras: true
      - texte: " est "
      - texte: non conforme
        gras: true
      - texte: " avec le RGAA (référentiel général d’amélioration de l’accessibilité). Le site n’a encore pas été audité."
  - type: titre_principal
    data:
      texte: Établissement de cette déclaration d’accessibilité
  - type: paragraphe
    data:
      texte: Cette déclaration a été établie le 18 septembre 2026.
  - type: titre_paragraphe
    data:
      texte: Technologies utilisées
  - type: paragraphe
    data:
      texte: "L’accessibilité de Nitrat'Info s’appuie sur les technologies suivantes :"
  - type: liste
    data:
      items:
      - texte: HTML
      - texte: WAI-ARIA
      - texte: CSS
      - texte: JavaScript
  - type: titre_paragraphe
    data:
      texte: Contenus non accessibles
  - type: paragraphe
    data:
      texte:
      - texte: Cartographie
        gras: true
  - type: paragraphe
    data:
      texte: La carte interactive permettant de localiser une parcelle n'est pas entièrement accessible.
        En particulier, le déplacement du marqueur de position nécessite une manipulation à la souris ou
        au doigt et ne peut pas être réalisé au clavier ni avec une technologie d'assistance. La recherche
        par commune reste utilisable comme alternative pour renseigner la localisation. Des travaux sont
        prévus prochainement pour rendre la carte et le positionnement du marqueur pleinement opérables
        au clavier.
  - type: paragraphe
    data:
      texte:
      - texte: Calendrier
        gras: true
  - type: paragraphe
    data:
      texte: L'affichage du calendrier repose sur un code couleur pour distinguer les périodes autorisées,
        soumises à conditions et interdites, ce qui peut en gêner la lecture pour les personnes ayant un
        trouble de la perception des couleurs ou utilisant un lecteur d'écran. L'ensemble des informations
        portées par ce code couleur est toutefois restitué sous forme textuelle. Une amélioration de la
        structure et de la restitution du calendrier est prévue prochainement.
  - type: titre_principal
    data:
      texte: Amélioration et contact
  - type: paragraphe
    data:
      texte: Si vous n’arrivez pas à accéder à un contenu ou à un service, vous pouvez contacter le responsable
        de Nitrat'Info pour être orienté vers une alternative accessible ou obtenir le contenu sous une
        autre forme.
  - type: liste
    data:
      items:
      - texte:
        - texte: "E-mail : "
        - texte: nitrates@beta.gouv.fr
          lien: mailto:nitrates@beta.gouv.fr
      - texte: "Adresse : Ministère de l’Agriculture, de l’Agro-alimentaire et de la Souveraineté Alimentaire,\
          \ 78 rue de Varenne, Paris"
  - type: paragraphe
    data:
      texte: Nous essayons de répondre dans les 2 jours ouvrés.
  - type: titre_principal
    data:
      texte: Voie de recours
  - type: paragraphe
    data:
      texte: "Cette procédure est à utiliser dans le cas suivant : vous avez signalé au responsable du\
        \ site internet un défaut d’accessibilité qui vous empêche d’accéder à un contenu ou à un des\
        \ services du portail et vous n’avez pas obtenu de réponse satisfaisante."
  - type: paragraphe
    data:
      texte: "Vous pouvez :"
  - type: liste
    data:
      items:
      - texte:
        - texte: "Écrire un message au "
        - texte: Défenseur des droits
          lien: https://formulaire.defenseurdesdroits.fr/
      - texte:
        - texte: "Contacter "
        - texte: le délégué du Défenseur des droits dans votre région
          lien: https://www.defenseurdesdroits.fr/saisir/delegues
      - texte: "Envoyer un courrier par la poste (gratuit, ne pas mettre de timbre) : Défenseur des droits,\
          \ Libre réponse 71120, 75342 Paris CEDEX 07"
  - type: paragraphe
    data:
      texte:
      - texte: "Cette déclaration d’accessibilité a été créée le 18 septembre 2026 grâce au "
      - texte: Générateur de Déclaration d’Accessibilité
        lien: https://betagouv.github.io/a11y-generateur-declaration/#create
      - texte: .

