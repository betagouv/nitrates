- cle: definition.types-fertilisants
  libelle_admin: Définition — Fertilisants de type 0, Ia, Ib, II et III
  type_contenu: definition
  titre_public: Fertilisants de type 0, Ia, Ib, II et III
  categorie: fertilisants-effluents
  termes_declencheurs:
  - type 0
  - type Ia
  - type Ib
  - type II
  - type III
  # Graphies des textes PC réglementaires (drawer conditions) : « type I.a »
  # et les énumérations « de types 0, I.a, I.b et II » où I.a/I.b sont seuls.
  - type I.a
  - type I.b
  - I.a
  - I.b
  schema: 1
  blocs:
  - type: tableau
    data:
      avec_entetes: true
      lignes:
      - [Type, Caractéristiques, Exemples, Valeurs guides]
      - - "0"
        - "Produits organiques caractérisés par une organisation nette à moyen terme\
          \ de l'azote"
        - "Boues de papeterie, marcs de raisins frais, composts de déchets verts jeunes\
          \ et ligneux"
        - "C/N > 20 ; Nmin/Ntot < 20 %"
      - - Ia
        - "Produits organiques à minéralisation d'azote très lente"
        - "Fumiers compacts non susceptibles d'écoulement, composts d'effluents d'élevage\
          \ à l'exception des composts de fientes de volailles. Composts d'ordures\
          \ ménagères résiduelles. Composts de fractions solides de digestats de méthanisation"
        - "C/N > 10 ; Nmin/Ntot < 20 % ; ISMO > 70 %"
      - - Ib
        - "Produits organiques à minéralisation d'azote lente"
        - "Déjections animales avec litière susceptibles d'écoulement, à l'exception\
          \ des fumiers de volaille. Composts de MIATE (matières d'intérêt agronomique\
          \ issues du traitement des eaux) mélangées à un support carboné, composts\
          \ de biodéchets"
        - "C/N > 8 ; 20 % < Nmin/Ntot ≤ 40 % ; ISMO > 50 %"
      - - II
        - "Produits organiques à minéralisation d'azote rapide"
        - "Lisiers, fumiers de volaille, effluents peu chargés, vinasses de betterave.\
          \ Farines de plumes, de poisson, de sang, d'os, tourteaux de ricin. Digestats\
          \ bruts de méthanisation, fractions liquides des digestats de méthanisation."
        - "Tout effluent organique qui n'entre pas dans les catégories précédentes."
      - - III
        - "Engrais azotés minéraux"
        - "Ammonitrates, urée…"
        - "-"

