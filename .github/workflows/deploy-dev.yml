name: Deploy dev

# CD nitrates-dev (carte #50). Se declenche au merge sur main (= branche
# d'integration de nitrates-dev). Sequence :
#   1. safety : liste des arbres actifs de dev -> artefact, AVANT le deploy.
#   2. deploy code : git archive -> scalingo deploy (par archive, token API,
#      pas de cle SSH). Le post_deploy joue migrate + imports SIG idempotents.
#   3. smoke : root repond, les arbres EN BASE sont valides pour le nouveau code.
#
# Le deploiement ne touche PAS aux donnees editees (arbres, referentiels,
# contenus PC) : c'est la base de l'environnement qui fait autorite. Il les
# rechargeait autrefois depuis les fichiers du repo, ce qui ecrasait a chaque
# merge les corrections faites dans l'admin. Propager une donnee d'un env a
# l'autre est un geste explicite, hors CD. Comme staging et prod.
#
# Secret requis : SCALINGO_API_TOKEN, dans l'environment `dev`.
#
# L'environment `dev` n'a volontairement PAS de required reviewer : ce
# workflow tourne a chaque push sur main, une approbation manuelle a chaque
# fois n'aurait aucun sens. Il sert a porter le SECRET, et a restreindre sa
# lecture aux seuls jobs qui tournent depuis main : un workflow pousse sur une
# branche arbitraire ne peut plus y acceder.

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  # Permet un declenchement manuel (bouton "Run workflow") pour rejouer.
  workflow_dispatch: {}

env:
  SCALINGO_REGION: osc-fr1
  SCALINGO_APP: nitrates-dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    # Porte le secret et restreint sa lecture aux jobs issus de main.
    environment:
      name: dev
      url: https://nitrates-dev.osc-fr1.scalingo.io/
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer la CLI Scalingo
        run: |
          curl -s -O https://cli-dl.scalingo.com/install && bash install
          scalingo --version

      # --- 1. SAFETY : trace des arbres actifs de dev AVANT le deploy -------
      # Recuperable dans les artifacts du run : permet de verifier apres coup
      # qu'une migration n'a pas deplace un arbre actif.
      - name: Safety — snapshot etat actif de dev
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: bash .github/scripts/deploy_dev_snapshot.sh

      - name: Upload snapshot (rollback)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dev-snapshot-before-deploy
          path: _deploy_snapshot/
          if-no-files-found: warn

      # --- 2. DEPLOY CODE : archive -> scalingo deploy ----------------------
      - name: Deploy code (archive)
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: bash .github/scripts/deploy_dev_code.sh "${{ github.sha }}"

      # --- 3. SMOKE ---------------------------------------------------------
      - name: Smoke test
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: bash .github/scripts/deploy_dev_smoke.sh
