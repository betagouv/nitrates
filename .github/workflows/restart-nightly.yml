name: Restart nightly

# Mitigation du swap Scalingo (probleme connu de la plateforme, partage par
# d'autres equipes betagouv) : au fil des jours sans deploiement, le kernel
# pagine la memoire des workers gunicorn vers le swap et chaque chemin de code
# froid coute des secondes de swap-in (mesure sur staging le 07/09 : 40% de
# swap apres 3 semaines, 302 a 2,5 s, login admin a 5 s, un 504).
# Un restart quotidien repart de zero. Voir carte #111.

permissions:
  contents: read

on:
  schedule:
    # ATTENTION au retard des crons GitHub : planifie a 03:30 UTC, ce job
    # partait en realite entre 08:05 et 09:12 UTC (observe du 11 au 14/09),
    # soit 10h30-11h30 heure de Paris -- EN PLEINE JOURNEE, et APRES la
    # fenetre 8h-10h qui concentre justement les pires latences (p95 horaire
    # 1,2 a 2,9 s : les premiers usages du matin paient la nuit de swap).
    # On vise donc 23:47 UTC : meme avec 5 h de derive, le restart tombe
    # avant 06:50 Paris, donc avant les premiers utilisateurs.
    - cron: "47 23 * * *"
  workflow_dispatch:

jobs:
  restart-staging:
    runs-on: ubuntu-latest
    # Environment DEDIE sans required reviewer : l'environment `staging`
    # (deploiements) exige une approbation manuelle, ce qui laissait ce cron
    # bloque en "waiting" indefiniment (constate le 10/09 : le run du 09/09
    # n'a jamais tourne). staging-ops porte le meme SCALINGO_API_TOKEN mais
    # ne gate pas : un restart est une operation reversible et sans risque de
    # donnees, contrairement a un deploiement.
    environment:
      name: staging-ops
      url: https://nitrates-staging.osc-fr1.scalingo.io/
    env:
      SCALINGO_REGION: osc-fr1
      SCALINGO_APP: nitrates-staging
    steps:
      - name: Installer la CLI Scalingo
        run: |
          curl -s -O https://cli-dl.scalingo.com/install && bash install
          scalingo --version

      - name: Restart
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: scalingo --region "$SCALINGO_REGION" --app "$SCALINGO_APP" restart

      - name: Smoke apres restart
        run: |
          # Le restart est progressif (rolling) mais on verifie quand meme que
          # l'app repond avant de conclure.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://nitrates-staging.osc-fr1.scalingo.io/")
            [ "$code" = "200" ] && { echo "OK ($code)"; exit 0; }
            sleep 15
          done
          echo "L'app ne repond pas apres restart (dernier code: $code)"
          exit 1
