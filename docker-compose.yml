volumes:
  # REVERT_AT_MERGE_TIME_FOR_UPSTREAM_ENVERGO : volume PostgreSQL 17 (refs #647).
  # L'ancien volume envergo_postgres_data (PostgreSQL 13) est conservé tel quel ;
  # migration des données : bin/local_postgres_13_to_17.sh
  envergo_postgres17_data: {}
  envergo_postgres_data_backups: {}
  envergo_node_modules: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    environment:
      - LANG=fr_FR.UTF-8
      - LC_ALL=fr_FR.UTF-8
    image: envergo_django
    container_name: envergo_django
    depends_on:
      - postgres
    volumes:
      - .:/app:z
      - envergo_node_modules:/app/node_modules
    env_file:
      - .env
      - ./envs/django
      - ./envs/postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    image: envergo_postgres
    container_name: envergo_postgres
    volumes:
      - envergo_postgres17_data:/var/lib/postgresql/data:Z
      - envergo_postgres_data_backups:/backups:z
    env_file:
      - .env
      - ./envs/postgres
    shm_size: 1g

  node:
    build:
      context: .
      dockerfile: ./compose/node/Dockerfile
    image: envergo_node
    container_name: envergo_node
    depends_on:
      - django
    volumes:
      - .:/app:z
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - envergo_node_modules:/app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
      # Expose browsersync UI: https://www.browsersync.io/docs/options/#option-ui
      - "3001:3001"
